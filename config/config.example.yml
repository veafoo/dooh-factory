# dooh-factory config (copy to config.yml, keep secrets out of git)

google:
  service_account_json: "./config/service-account.json"  # gitignored
  spreadsheet_id: "PUT_SHEET_ID_HERE"

paths:
  assets_dir: "./assets"        # base dir for rushes (Mode 1)
  templates_dir: "./templates"  # HTML5 creatives (Mode 2)
  output_dir: "./output"

ffmpeg:
  bin: "ffmpeg"
  # DOOH output defaults. `format` in a row overrides width/height per creative.
  width: 1080
  height: 1920
  fps: 25
  video_codec: "libx264"
  pix_fmt: "yuv420p"
  # Rate control: set `bitrate` for the CBR-ish specs most DOOH CMS ask for,
  # otherwise CRF is used. Leave bitrate empty to stay on CRF.
  crf: 20
  preset: "medium"
  # bitrate: "8M"
  # maxrate: "8M"
  # bufsize: "16M"
  profile: "high"      # baseline | main | high - match the CMS ingest spec
  level: "4.1"
  gop: 25              # keyframe every N frames (= 1s at 25fps); many CMS require it
  faststart: true      # moov atom up front
  default_duration_s: 10   # animated Mode 2 capture when the row says nothing
  still_duration_s: 4      # hold time for a still image used as a Mode 1 rush
  transition_duration_s: 0.5   # xfade length when a row asks for a transition
  # max_duration_s: 15     # hard cap on any rendered creative

  # Per-format ingest specs. Merged over the block above when a creative's
  # `format` matches, so a profile only states what differs.
  profiles:
    # "3840x2160":
    #   bitrate: "20M"
    #   gop: 50
    # "1920x1080":
    #   bitrate: "10M"

# ---------------------------------------------------------------------------
# Delivery: what a buyer actually traffics.
# Remove this whole block to go back to "render one master MP4 and stop".
# The ladders below are conventional starting points, NOT a quotation of a
# specific IAB document - every network and SSP publishes its own ingest spec
# and that spec wins. Tune them to what the buyer asks for.
# ---------------------------------------------------------------------------
delivery:
  channel: "dooh"           # default; a row's `channel` column overrides
  vast: true
  base_url: ""              # CDN prefix for MediaFile URLs; empty = file:// (local validation)
  channels:
    dooh:
      audio: false          # public screens are muted
      mezzanine: false
      ladder:
        - {width: 1080, height: 1920, bitrate: "8M"}
    ctv:
      audio: true
      mezzanine: true       # SSAI re-encodes from it; missing = VAST error 406
      audio_spec: {codec: "aac", bitrate: "192k", sample_rate: 48000, channels: 2}
      ladder:
        - {width: 1920, height: 1080, bitrate: "8M", profile: "high", level: "4.1"}
        - {width: 1280, height: 720, bitrate: "4M"}
    mobile:
      audio: true
      mezzanine: false
      ladder:
        - {width: 1280, height: 720, bitrate: "2M"}
        - {width: 854, height: 480, bitrate: "1M"}
        - {width: 640, height: 360, bitrate: "600k"}

vast:
  version: "4.2"
  ad_system: "dooh-factory"
  advertiser: ""
  id_registry: "unknown"    # 'Ad-ID' / 'clearcast' once the creative is registered
  # Leave [CACHEBUSTING] in: the player substitutes it. Without it you either
  # double-count or lose hits to caching.
  impression_url: ""        # e.g. https://adserver/imp?cb=[CACHEBUSTING]
  error_url: ""             # e.g. https://adserver/err?code=[ERRORCODE] - without
                            # this, a player rejecting the creative is invisible
  click_through: ""         # ignored on the dooh channel: no click on a street panel
  click_tracking: []
  tracking:
    start: ""
    firstQuartile: ""
    midpoint: ""
    thirdQuartile: ""
    complete: ""

scheduler:
  timezone: "Europe/Paris"
  min_interval_seconds: 60   # refuses a cadence faster than this

jobs:
  mode1:
    mode: "stitch"            # FFmpeg stitching
    worksheet: "mode1"        # sheet tab name
    cadence: "daily@08:00"    # once | hourly | daily@HH:MM | every_N_minutes | cron:<expr>
    naming_fallback: "{creative_id}"

  mode2:
    mode: "html5"             # HTML5 injected variant capture
    worksheet: "mode2"
    cadence: "hourly"
    naming_fallback: "{variant_id}"
    inject: "dom"             # query | window_var | postmessage | dom
    window_var: "__DATA__"    # used when inject = window_var
    capture: "auto"           # static | video | frames | auto
    animated_engine: "video"  # what `auto` picks when the row has a duration
    static_format: "jpg"      # jpg | png
    jpeg_quality: 90
    wait_until: "load"        # load | domcontentloaded | networkidle
    settle_ms: 300            # extra wait after load before capturing
    timeout_ms: 30000
    device_scale_factor: 1    # 2 renders at 2x then downscales (crisper text)
    headless: true
